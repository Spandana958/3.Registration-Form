<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form{
            background-color: bisque;
            border: 3px solid black;
            padding-left: 12px;
            padding-bottom: 10px;
            max-width: 600px;
        }
        h1{
            text-align: center;
        }
        
    </style>
</head>
<body>
    <form>
    <h1> REGISTRATION FORM</h1>
    <label>Name : </label><input type="text" name="name"><br><br>
    <label>LastName : </label><input type="text" name="n1"><br><br>
    <label>Gender :</label><br><br><input type="radio" name="Gender" value="Male"><label>Male</label>
    <input type="radio" name="Gender" value="Female"><label>Female</label>
    <input type="radio" name="Gender" value="Others"><label>Others</label><br><br>
    <label>Email : </label><input type="email" name="n3"><br><br>
    <label>Phone : </label><input type="number" country-code="+91" name="n2"><br><br>
    <label>Address :</label><br><br><textarea id="Address" name="n8" rows="3" cols="40"></textarea><br><br>
    <label>Date Of Birth : </label><input type="date" name="n8"><br><br>
    <label>Choose Your Interest : </label><br><br>
    <input type="checkbox" name="n4" value="Movies"><label>Movies</label>
    <input type="checkbox" name="n5" value="Musics"><label>Musics</label>
    <input type="checkbox" name="n6" value="Sports"><label>Sports</label><br><br>
    <input type="button" value="Submit">

    </form>
</body>
</html>
